spring.application.name=task_manager
server.port=9000
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasksdb}
spring.datasource.username=${DB_USER:task_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
security.jwt.secret-key=${JWT_SECRET}
security.jwt.access-expiration-time=900000
security.jwt.refresh-expiration-time=604800000
