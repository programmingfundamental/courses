server {
    listen 80;
    server_name localhost;
    client_max_body_size 32k;
    # Do not log URLs, query strings, cookies, or Authorization headers.
    access_log off;
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 81;
    server_name localhost;
    access_log off;
    location = /attacker.html { root /usr/share/nginx/html; }
    location / { return 404; }
}
