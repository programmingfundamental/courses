<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{parts :: head('Досие на сметка')}"></head>
<body>
<header th:replace="~{parts :: nav}"></header>
<main>
  <div class="intro"><a th:href="@{/accounts}">← Сметките ми</a><h1 th:text="${row.holderName}"></h1></div>
  <section class="card">
    <dl class="metrics">
      <div><dt>Вид сметка</dt><dd th:text="${row.accountType}"></dd></div>
      <div><dt>IBAN</dt><dd class="mono" th:text="${row.iban}"></dd></div>
      <div><dt>Дата на откриване</dt><dd th:text="${row.openedOn}"></dd></div>
      <div><dt>Криптирано ЕГН</dt><dd class="mono" th:text="${row.egn}"></dd></div>
    </dl>
    <h2>Основание за откриване</h2>
    <div th:utext="${row.reason}"></div>
  </section>
</main>
<footer th:replace="~{parts :: foot}"></footer>
</body>
</html>
