<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{parts :: head('Откриване на сметка')}"></head>
<body>
<header th:replace="~{parts :: nav}"></header>
<main>
  <div class="intro"><h1>Откриване на сметка</h1><p>Въведете фиктивни данни. IBAN се генерира при запис.</p></div>
  <section class="card">
    <p class="alert" role="alert" th:if="${!error.isEmpty()}" th:text="${error}"></p>
    <form method="post" th:action="@{/accounts}">
      <div class="form-grid">
        <div><label for="firstName">Собствено име</label><input id="firstName" name="firstName" maxlength="50" th:value="${firstName}" required></div>
        <div><label for="middleName">Бащино име</label><input id="middleName" name="middleName" maxlength="50" th:value="${middleName}" required></div>
        <div><label for="lastName">Фамилия</label><input id="lastName" name="lastName" maxlength="50" th:value="${lastName}" required></div>
        <div><label for="egn">ЕГН</label><input id="egn" name="egn" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="0000001004" th:value="${egn}" required></div>
        <div><label for="type">Вид сметка</label><select id="type" name="type"><option th:each="item : ${accountTypes}" th:value="${item}" th:text="${item}" th:selected="${item == type}"></option></select></div>
        <div><label for="openedOn">Дата на откриване</label><input id="openedOn" name="openedOn" type="date" th:value="${openedOn}" required></div>
      </div>
      <label for="reason">Основание за откриване</label>
      <textarea id="reason" name="reason" maxlength="2000" rows="5" th:text="${reason}" required></textarea>
      <button class="primary">Открий сметката</button>
    </form>
  </section>
</main>
<footer th:replace="~{parts :: foot}"></footer>
</body>
</html>
