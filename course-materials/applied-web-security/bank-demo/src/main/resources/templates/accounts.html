<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{parts :: head('Регистър на сметките')}"></head><body><header th:replace="~{parts :: nav}"></header><main><div class="intro title-row"><div><span class="eyebrow">Операции / Регистър</span><h1>Банкови сметки</h1><p>Намерете учебна сметка и разгледайте записа ѝ.</p></div><a class="primary" th:href="@{/accounts/new}">+ Нова сметка</a></div>
<section class="card"><form method="get" th:action="@{/accounts}"><label for="q">Търсене по псевдоним, учебен IBAN или ЕГН</label><div class="search"><input type="search" id="q" name="q" maxlength="100" placeholder="Например: Орбита или 1001" th:value="${q}"><button class="primary">Търси</button><a class="quiet" th:href="@{/accounts}">Изчисти</a></div></form></section>
<section class="ledger"><div class="title-row"><h2>Резултати</h2><span class="badge" th:text="|Брой: ${rows.size()}|"></span></div>
<div class="table-wrap" th:unless="${rows.isEmpty()}"><table><thead><tr><th>№</th><th>Псевдоним</th><th>Край на IBAN</th><th>Досие</th></tr></thead>
<tbody><tr th:each="a : ${rows}"><td th:text="${a.id}"></td><td th:text="${a.alias}"></td><td class="mono" th:text="|•••• ${a.ibanTail}|"></td><td><a th:href="@{/accounts/{id}(id=${a.id})}">Отвори →</a></td></tr></tbody></table></div>
<p class="card" th:if="${rows.isEmpty()}">Няма съвпадения. Опитайте с по-кратък фрагмент или изчистете търсенето.</p></section></main><footer th:replace="~{parts :: foot}"></footer></body></html>
