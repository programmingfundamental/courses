<!doctype html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{parts :: head('Вход')}"></head>
<body>
<header th:replace="~{parts :: demoHeader}"></header>
<main>
  <div class="intro"><h1>Вход в БанкЛаб</h1><p>Учебна банка с фиктивни сметки.</p></div>
  <section class="card login-card">
    <p>Влезте с <code>user</code> и парола <code>123456</code>.</p>
    <p class="alert" role="alert" th:if="${param.error != null}">Името или паролата са грешни.</p>
    <p class="notice" th:if="${param.logout != null}">Сесията приключи.</p>
    <form method="post" th:action="@{/login}">
      <label for="username">Потребител</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Парола</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary">Вход</button>
    </form>
  </section>
</main>
<footer th:replace="~{parts :: foot}"></footer>
</body>
</html>
