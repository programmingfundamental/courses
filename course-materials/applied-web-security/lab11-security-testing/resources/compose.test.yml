name: web-security-task-manager-tests
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: tasks_test
      POSTGRES_USER: task_test
      POSTGRES_PASSWORD: task-test-password
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U task_test -d tasks_test"]
      interval: 3s
      timeout: 3s
      retries: 20
