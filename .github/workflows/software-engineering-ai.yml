name: Software Engineering AI
on:
  push:
    paths: ['course-materials/software-engineering-ai/**', '.github/workflows/software-engineering-ai.yml']
  pull_request:
    paths: ['course-materials/software-engineering-ai/**', '.github/workflows/software-engineering-ai.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-materials/software-engineering-ai/ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: course-materials/software-engineering-ai/ai-platform/requirements.lock
      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit and contract tests
        run: pytest -m "not integration" -q
      - name: Full integration and coverage gate
        run: pytest --cov=ai_platform --cov-fail-under=85 --cov-report=xml -q
      - name: Data and course contracts
        run: |
          python -m ai_platform.cli validate
          python scripts/check_notebook.py
          python scripts/verify_course.py
      - name: Build validated immutable release
        run: |
          python -m ai_platform.cli train --version ci-${{ github.sha }}
          python -m ai_platform.cli promote --version ci-${{ github.sha }}
          docker build --build-arg MODEL_VERSION=ci-${{ github.sha }} -t ai-course:${{ github.sha }} .
      - name: Local deployment smoke
        run: |
          export AI_API_KEY=$(python -c "import secrets; print(secrets.token_hex(32))")
          trap 'docker rm -f ai-course-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name ai-course-ci -p 127.0.0.1:18090:8000 --env AI_API_KEY ai-course:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/health/ready; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18090/health/ready
          python scripts/benchmark.py --port 18090 --count 10
      - uses: actions/upload-artifact@v4
        with:
          name: validated-model-${{ github.sha }}
          path: |
            course-materials/software-engineering-ai/ai-platform/artifacts/
            course-materials/software-engineering-ai/ai-platform/coverage.xml
          retention-days: 7
