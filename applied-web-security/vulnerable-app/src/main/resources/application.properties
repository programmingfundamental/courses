server.address=${BIND_ADDRESS:127.0.0.1}
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:mem:lab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=15m
server.error.include-message=never
server.error.include-stacktrace=never
lab.mode=${LAB_MODE:secure}
lab.max-attempts=${MAX_ATTEMPTS:5}
lab.lock-duration=${LOCK_DURATION:PT60S}
lab.reset-after-success=${RESET_AFTER_SUCCESS:true}
lab.key-file=${LAB_KEY_FILE:}
logging.level.org.springframework.security=INFO
