quarkus.application.name=activity-service
quarkus.http.port=8082
quarkus.http.host=127.0.0.1
quarkus.http.test-port=0
quarkus.devservices.enabled=false
quarkus.analytics.disabled=true
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
%test.quarkus.otel.sdk.disabled=true
quarkus.log.console.json.enabled=true
mp.jwt.verify.issuer=https://mobile-lab.invalid
mp.jwt.verify.audiences=mobile-api
mp.jwt.verify.publickey.location=${LAB_PUBLIC_KEY:publicKey.pem}
quarkus.rest-client.users.url=${USER_URL:http://localhost:8081}
quarkus.rest-client.activities.url=${ACTIVITY_URL:http://localhost:8082}
quarkus.rest-client.notifications.url=${NOTIFICATION_URL:http://localhost:8083}
quarkus.rest-client.bff.url=${BFF_URL:http://localhost:8084}
quarkus.rest-client.connect-timeout=500
quarkus.rest-client.read-timeout=1200
lab.fault-mode=${FAULT_MODE:ok}
# TODO L10-G: защитете /mobile/* (BFF) и business paths на услугите чрез policy/roles.
# Health endpoints остават отделни от business API.

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/activities;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:activities;DB_CLOSE_DELAY=-1
mp.messaging.outgoing.activity-events.connector=smallrye-kafka
mp.messaging.outgoing.activity-events.topic=activity-events
mp.messaging.outgoing.activity-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.activity-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.activity-events.enabled=false
%events.mp.messaging.outgoing.activity-events.enabled=true
%test.mp.messaging.outgoing.activity-events.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
